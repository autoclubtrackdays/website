<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Panel · Autoclub Trackdays</title>
		<style>
			:root {
				--amarillo: #ffea00;
				--borde: #e5e7eb;
				--gris: #6b7280;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				padding: 0 0 6rem;
				font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
				color: #111827;
				background: #fff;
			}

			header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 1rem;
				padding: 1rem 2rem;
				background: #000;
				color: #fff;
			}

			header strong {
				font-size: 1.25rem;
				letter-spacing: 0.02em;
				text-transform: uppercase;
			}

			main {
				/* 72rem: el mismo ancho que max-w-6xl en la web, para que el panel y
				   el sitio se sientan del mismo tamaño. */
				max-width: 72rem;
				margin: 0 auto;
				padding: 0 1.5rem;
			}

			h1 {
				margin: 3rem 0 0;
				font-size: 2rem;
				text-transform: uppercase;
				letter-spacing: -0.02em;
			}

			h1 + .barra {
				display: block;
				width: 4rem;
				height: 4px;
				margin-top: 0.75rem;
				background: var(--amarillo);
			}

			h2 {
				margin: 2.5rem 0 0;
				font-size: 0.8125rem;
				text-transform: uppercase;
				letter-spacing: 0.05em;
				color: var(--gris);
			}

			button {
				padding: 0.625rem 1.25rem;
				border: 1px solid var(--borde);
				border-radius: 2px;
				background: #fff;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}

			button:hover:not(:disabled) {
				border-color: #111827;
			}

			button.principal {
				border-color: var(--amarillo);
				background: var(--amarillo);
			}

			button.principal:hover:not(:disabled) {
				background: #e6d200;
				border-color: #e6d200;
			}

			header button {
				border-color: #fff;
				background: #fff;
				color: #111827;
			}

			header button:hover:not(:disabled) {
				border-color: var(--amarillo);
				background: var(--amarillo);
			}

			/* Cuando hay algo sin publicar, el botón lo dice y se pone amarillo. */
			header button.pendiente {
				border-color: var(--amarillo);
				background: var(--amarillo);
			}

			button:disabled {
				opacity: 0.4;
				cursor: not-allowed;
			}

			#zona {
				margin-top: 1rem;
				padding: 2.5rem 1.5rem;
				border: 2px dashed var(--borde);
				border-radius: 2px;
				text-align: center;
				color: var(--gris);
			}

			#zona.encima {
				border-color: var(--amarillo);
				background: #fffbe6;
			}

			#miniaturas {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem;
				margin-top: 1rem;
			}

			#miniaturas figure {
				position: relative;
				width: 6rem;
				margin: 0;
				cursor: grab;
			}

			/* La que se está arrastrando se apaga, y las demás dejan hueco al
			   pasar por encima porque se reordenan en vivo. */
			#miniaturas figure.arrastrando {
				opacity: 0.35;
				cursor: grabbing;
			}

			#miniaturas figure.portada img {
				border: 2px solid #000;
			}

			#miniaturas img {
				display: block;
				width: 100%;
				aspect-ratio: 4 / 3;
				object-fit: cover;
				border: 1px solid var(--borde);
			}

			#miniaturas .quitar {
				position: absolute;
				top: 0;
				right: 0;
				padding: 0.125rem 0.375rem;
				border: 0;
				border-radius: 0;
				background: #000;
				color: #fff;
				font-size: 0.75rem;
				line-height: 1.2;
				cursor: pointer;
			}

			#miniaturas .quitar:hover {
				background: #dc2626;
			}

			#miniaturas figcaption {
				position: absolute;
				top: 0;
				left: 0;
				padding: 0.125rem 0.375rem;
				background: #000;
				color: #fff;
				font-size: 0.6875rem;
				font-variant-numeric: tabular-nums;
			}

			.campos {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
				gap: 1rem 1.5rem;
				margin-top: 1rem;
			}

			label {
				display: block;
				font-size: 0.8125rem;
				font-weight: 600;
			}

			label .opcional {
				font-weight: 400;
				color: var(--gris);
			}

			input,
			select,
			textarea {
				width: 100%;
				margin-top: 0.25rem;
				padding: 0.5rem 0.625rem;
				border: 1px solid var(--borde);
				border-radius: 2px;
				font: inherit;
				background: #fff;
			}

			input:focus,
			select:focus,
			textarea:focus {
				outline: none;
				border-color: #111827;
			}

			input:invalid:not(:placeholder-shown) {
				border-color: #dc2626;
			}

			.ayuda {
				margin-top: 0.25rem;
				font-size: 0.75rem;
				color: var(--gris);
			}

			.fecha {
				display: flex;
				gap: 0.5rem;
			}

			textarea {
				min-height: 8rem;
				resize: vertical;
			}

			.acciones {
				display: flex;
				flex-wrap: wrap;
				gap: 0.75rem;
				align-items: center;
				margin-top: 2rem;
			}

			.aviso {
				margin-top: 1rem;
				padding: 1rem;
				border-left: 4px solid var(--amarillo);
				background: #fffbe6;
				font-size: 0.9375rem;
			}

			.aviso.malo {
				border-left-color: #dc2626;
				background: #fef2f2;
			}

			.aviso.bueno {
				border-left-color: #16a34a;
				background: #f0fdf4;
			}

			dialog {
				max-width: 34rem;
				border: 1px solid var(--borde);
				border-radius: 2px;
				padding: 2rem;
			}

			dialog::backdrop {
				background: rgb(0 0 0 / 0.6);
			}

			dialog dl {
				max-height: 50vh;
				overflow: auto;
				margin: 1rem 0 0;
				font-size: 0.9375rem;
			}

			dialog dl div {
				display: flex;
				justify-content: space-between;
				gap: 1rem;
				padding: 0.375rem 0;
				border-bottom: 1px solid #f3f4f6;
			}

			dialog dt {
				color: var(--gris);
			}

			dialog dd {
				margin: 0;
				font-weight: 600;
				text-align: right;
			}

			.oculto {
				display: none;
			}

			.tabla {
				width: 100%;
				margin-top: 1rem;
				border-collapse: collapse;
			}

			.tabla th {
				padding: 0.5rem 0.5rem 0.5rem 0;
				border-bottom: 1px solid var(--borde);
				text-align: left;
				font-size: 0.75rem;
				text-transform: uppercase;
				letter-spacing: 0.03em;
				color: var(--gris);
			}

			.tabla td {
				padding: 0.75rem 0.5rem 0.75rem 0;
				border-bottom: 1px solid #f3f4f6;
				vertical-align: middle;
			}

			.tabla td.ref {
				font-variant-numeric: tabular-nums;
				font-weight: 600;
				white-space: nowrap;
			}

			.tabla td.botones {
				text-align: right;
				white-space: nowrap;
			}

			.tabla button {
				padding: 0.375rem 0.75rem;
				font-size: 0.8125rem;
			}

			.atras {
				margin-top: 2rem;
			}

			.inicio {
				display: flex;
				flex-wrap: wrap;
				gap: 1rem;
				margin-top: 2rem;
			}

			.inicio button {
				padding: 1.5rem 2rem;
				font-size: 1.0625rem;
			}
		</style>
	</head>

	<body>
		<header>
			<strong>Autoclub Trackdays</strong>
			<button id="cerrar">Cerrar panel</button>
		</header>

		<main>
			<h1 id="titulo">Panel</h1>
			<span class="barra"></span>

			<div id="aviso-r2" class="aviso malo oculto">
				R2 no está configurado, así que las fotos no se podrán subir. Revisa el archivo
				<code>.env</code>.
			</div>

			<div class="inicio" id="inicio">
				<button class="principal" id="empezar">Añadir nuevo coche</button>
				<button id="ver-lista">Coches en venta</button>
				<button id="ver-destacados">Cambiar destacados</button>
				<button id="ver-vendidos">Coches vendidos</button>
			</div>

			<div class="atras oculto" id="zona-atras">
				<button id="atras">← Volver</button>
			</div>

			<section id="lista" class="oculto"></section>
			<section id="destacados" class="oculto"></section>
			<section id="vendidos" class="oculto"></section>

			<form id="formulario" class="oculto">
				<h2>Fotos del coche</h2>

				<div id="zona">
					<p>Arrastra aquí la carpeta con las fotos</p>
					<div class="acciones" style="justify-content: center">
						<button type="button" id="examinar-carpeta">Elegir carpeta</button>
						<button type="button" id="examinar-fotos">Elegir fotos sueltas</button>
					</div>

					<!-- Sin `accept`: al seleccionar carpeta, el diálogo filtra por tipo
					     de archivo y esconde los directorios, así que no se puede
					     navegar. Las imágenes ya se filtran después, en el script. -->
					<input type="file" id="carpeta" webkitdirectory multiple hidden />
					<input type="file" id="fotos-sueltas" multiple accept="image/*" hidden />
				</div>

				<div id="miniaturas"></div>

				<h2>Datos del coche</h2>
				<div class="campos" id="campos"></div>

				<h2>Comentario</h2>
				<textarea
					id="comentario"
					placeholder="Lo que quieras contar del coche. Se publica tal cual, en la ficha."
				></textarea>

				<div class="acciones">
					<button class="principal" type="submit">Añadir</button>
					<button type="button" id="cancelar">Cancelar</button>
				</div>
			</form>

			<div id="resultado"></div>
		</main>

		<dialog id="confirmacion">
			<strong id="pregunta">¿Damos de alta este coche?</strong>
			<dl id="resumen"></dl>
			<div class="acciones">
				<button class="principal" id="confirmar">Sí, añadir</button>
				<button id="volver">Volver</button>
			</div>
		</dialog>

		<script type="module">
			const $ = (id) => document.getElementById(id);
			const MESES = ['01','02','03','04','05','06','07','08','09','10','11','12'];

			let campos = [];

			/**
			 * Galería del coche en el orden en que se verá en la web. Una sola lista
			 * para poder arrastrar y mezclar las que ya están subidas con las nuevas.
			 *
			 *   { tipo: 'r2',    nombre, url }      ya está en R2
			 *   { tipo: 'nueva', archivo, url }     recién elegida del disco
			 */
			let galeria = [];

			const yaEnR2 = () => galeria.filter((foto) => foto.tipo === 'r2');
			const sinSubir = () => galeria.filter((foto) => foto.tipo === 'nueva');

			/**
			 * Nombre de archivo de cada foto, en el orden de la galería.
			 *
			 * Las que ya están en R2 conservan el suyo —renombrarlas obligaría a
			 * volver a subirlas— y las nuevas cogen los primeros números libres. El
			 * orden no vive en los números sino en el campo Fotos del .txt, que es
			 * una lista: por eso reordenar al editar no sube ni un byte.
			 */
			function nombresDeGaleria() {
				let siguiente =
					yaEnR2().reduce((mayor, foto) => Math.max(mayor, Number(foto.nombre) || 0), 0) + 1;

				return galeria.map((foto) =>
					foto.tipo === 'r2' ? foto.nombre : String(siguiente++).padStart(2, '0'),
				);
			}

			// --- Formulario, dibujado desde la misma lista que parsea los .txt ----

			function pintarCampos(valores = {}) {
				// La fecha llega como MM/AAAA y en el formulario son dos controles.
				const [mesPrevio = '', anioPrevio = ''] = String(
					valores.first_registration ?? '',
				).split('/');

				$('campos').innerHTML = campos
					.filter((campo) => !campo.automatico)
					.map((campo) => {
						const previo = valores[campo.clave] ?? '';
						const valor = previo === '' ? '' : ` value="${String(previo).replace(/"/g, '&quot;')}"`;
						const obligatorio = campo.obligatorio ? 'required' : '';
						const marca = campo.obligatorio ? '' : ' <span class="opcional">(opcional)</span>';
						const ayuda = campo.ayuda ? `<p class="ayuda">${campo.ayuda}</p>` : '';
						const sufijo = campo.sufijo ? ` <span class="opcional">(${campo.sufijo})</span>` : '';

						let control;

						if (campo.tipo === 'entero') {
							control = `<input type="number" step="1" min="0" name="${campo.clave}"${valor} ${obligatorio} placeholder=" " />`;
						} else if (campo.tipo === 'opciones' || campo.tipo === 'sino') {
							const listadas = campo.tipo === 'sino' ? ['Sí', 'No'] : campo.opciones;

							// Si lo que ya tiene el coche no está en la lista, se añade en vez
							// de dejarlo fuera: el desplegable saldría en blanco y al guardar
							// se perdería el dato sin que nadie se entere.
							const opciones =
								previo !== '' && !listadas.some((o) => String(o) === String(previo))
									? [previo, ...listadas]
									: listadas;

							control = `<select name="${campo.clave}" ${obligatorio}>
								<option value="">—</option>
								${opciones
									.map((o) => `<option${String(previo) === String(o) ? ' selected' : ''}>${o}</option>`)
									.join('')}
							</select>`;
						} else if (campo.tipo === 'fecha') {
							const anio = new Date().getFullYear();
							control = `<div class="fecha">
								<select name="mes" ${obligatorio}>
									<option value="">Mes</option>
									${MESES.map((m) => `<option${m === mesPrevio ? ' selected' : ''}>${m}</option>`).join('')}
								</select>
								<input type="number" name="anio" min="1950" max="${anio + 1}" step="1" placeholder="Año" value="${anioPrevio}" ${obligatorio} />
							</div>`;
						} else {
							control = `<input type="text" name="${campo.clave}"${valor} ${obligatorio} placeholder=" " />`;
						}

						return `<div><label>${campo.etiqueta}${sufijo}${marca}${control}</label>${ayuda}</div>`;
					})
					.join('');
			}

			// --- Fotos -----------------------------------------------------------

			// El tipo lo pone el sistema y no siempre lo sabe: en Windows un .heic
			// del iPhone llega con el tipo vacío. Por eso también se mira la
			// extensión, que sharp sabe convertir igual.
			const EXTENSIONES = /\.(jpe?g|png|webp|gif|tiff?|avif|heic|heif)$/i;
			const esImagen = (archivo) =>
				archivo.type.startsWith('image/') || EXTENSIONES.test(archivo.name);

			function pintarMiniaturas() {
				const total = galeria.length;

				$('zona').querySelector('p').textContent =
					total === 0
						? 'Arrastra aquí la carpeta con las fotos'
						: total === 1
							? '1 foto. Es la de portada.'
							: `${total} fotos. La primera es la de portada; arrástralas para cambiar el orden.`;

				$('miniaturas').innerHTML = galeria
					.map(
						(foto, indice) => `<figure draggable="true" data-indice="${indice}"${indice === 0 ? ' class="portada"' : ''}>
						<img src="${foto.url}" alt="" draggable="false" />
						<figcaption>${indice === 0 ? 'Portada' : indice + 1}</figcaption>
						<button type="button" class="quitar" data-quitar="${indice}" title="Quitar esta foto">✕</button>
					</figure>`,
					)
					.join('');
			}

			// --- Reordenar arrastrando -------------------------------------------
			//
			// Se mueve el <figure> dentro del DOM mientras dura el arrastre y al
			// soltar se relee el orden de ahí. Volver a pintar en cada `dragover`
			// destruiría el elemento que se está arrastrando y cortaría el gesto.

			let arrastrando = null;

			$('miniaturas').addEventListener('dragstart', (evento) => {
				arrastrando = evento.target.closest('figure');
				if (!arrastrando) return;

				arrastrando.classList.add('arrastrando');
				evento.dataTransfer.effectAllowed = 'move';
				// Firefox no arranca el arrastre si no se escribe algo aquí.
				evento.dataTransfer.setData('text/plain', arrastrando.dataset.indice);
			});

			$('miniaturas').addEventListener('dragover', (evento) => {
				if (!arrastrando) return;
				evento.preventDefault();

				const encima = evento.target.closest('figure');
				if (!encima || encima === arrastrando) return;

				// Por qué mitad se está pasando decide si cae antes o después.
				const caja = encima.getBoundingClientRect();
				const despues = evento.clientX > caja.left + caja.width / 2;

				encima.parentNode.insertBefore(arrastrando, despues ? encima.nextSibling : encima);
			});

			$('miniaturas').addEventListener('drop', (evento) => evento.preventDefault());

			$('miniaturas').addEventListener('dragend', () => {
				if (!arrastrando) return;

				arrastrando.classList.remove('arrastrando');
				arrastrando = null;

				galeria = [...$('miniaturas').querySelectorAll('figure')].map(
					(figura) => galeria[Number(figura.dataset.indice)],
				);

				// Se repinta para renumerar y marcar la nueva portada.
				pintarMiniaturas();
			});

			// Quitar una foto suelta, esté ya en R2 o recién elegida.
			$('miniaturas').addEventListener('click', async (evento) => {
				const boton = evento.target.closest('button[data-quitar]');
				if (!boton) return;

				const indice = Number(boton.dataset.quitar);
				const foto = galeria[indice];

				if (foto.tipo === 'nueva') {
					galeria.splice(indice, 1);
					return pintarMiniaturas();
				}

				if (!confirm('¿Quitar esta foto? Se borra de R2 y no se puede deshacer.')) return;

				boton.disabled = true;
				const referencia = $('formulario').dataset.referencia;

				const borrada = await fetch(
					`/api/fotos?referencia=${encodeURIComponent(referencia)}&nombre=${encodeURIComponent(foto.nombre)}`,
					{ method: 'DELETE' },
				).then((r) => r.json());

				if (borrada.error) return alert(borrada.error);

				galeria.splice(indice, 1);
				pintarMiniaturas();
			});

			function aceptarArchivos(lista) {
				// Se añaden a lo que ya hubiera, para poder completar una galería en
				// dos tandas. Por nombre, que es el orden en que salieron de la cámara.
				// `numeric` es lo que hace que IMG_9 vaya antes que IMG_10; sin eso el
				// orden alfabético las deja al revés.
				const nuevas = [...lista]
					.filter(esImagen)
					.sort((a, b) => a.name.localeCompare(b.name, 'es', { numeric: true }))
					.map((archivo) => ({ tipo: 'nueva', archivo, url: URL.createObjectURL(archivo) }));

				galeria = [...galeria, ...nuevas];
				pintarMiniaturas();
			}

			/** Recorre una carpeta arrastrada, que llega como árbol y no como lista. */
			async function archivosDeEntrada(entrada) {
				if (entrada.isFile) {
					return [await new Promise((r) => entrada.file(r))];
				}

				const lector = entrada.createReader();
				const hijos = await new Promise((r) => lector.readEntries(r));
				const listas = await Promise.all(hijos.map(archivosDeEntrada));
				return listas.flat();
			}

			$('examinar-carpeta').addEventListener('click', () => $('carpeta').click());
			$('examinar-fotos').addEventListener('click', () => $('fotos-sueltas').click());

			for (const id of ['carpeta', 'fotos-sueltas']) {
				$(id).addEventListener('change', (evento) => aceptarArchivos(evento.target.files));
			}

			['dragenter', 'dragover'].forEach((evento) =>
				$('zona').addEventListener(evento, (e) => {
					e.preventDefault();
					$('zona').classList.add('encima');
				}),
			);

			['dragleave', 'drop'].forEach((evento) =>
				$('zona').addEventListener(evento, () => $('zona').classList.remove('encima')),
			);

			$('zona').addEventListener('drop', async (e) => {
				e.preventDefault();

				const entradas = [...e.dataTransfer.items]
					.map((item) => item.webkitGetAsEntry?.())
					.filter(Boolean);

				const listas = await Promise.all(entradas.map(archivosDeEntrada));
				aceptarArchivos(listas.flat());
			});

			// --- Alta -------------------------------------------------------------

			function recogerDatos() {
				const formulario = new FormData($('formulario'));
				const datos = {};

				for (const campo of campos) {
					if (campo.automatico) continue;

					if (campo.tipo === 'fecha') {
						const mes = formulario.get('mes');
						const anio = formulario.get('anio');
						if (mes && anio) datos[campo.clave] = `${mes}/${anio}`;
						continue;
					}

					const valor = formulario.get(campo.clave);
					if (valor) datos[campo.clave] = campo.tipo === 'entero' ? Number(valor) : valor;
				}

				// El campo guarda los nombres y en el orden de la galería: así se puede
				// borrar o reordenar sin renumerar nada en R2.
				const nombres = nombresDeGaleria();
				if (nombres.length > 0) datos.images = nombres.join(',');

				return datos;
			}

			const etiquetaDe = (clave) => campos.find((c) => c.clave === clave)?.etiqueta ?? clave;

			$('formulario').addEventListener('submit', (e) => {
				e.preventDefault();

				const datos = recogerDatos();

				$('resumen').innerHTML = [
					...Object.entries(datos).map(
						([clave, valor]) =>
							`<div><dt>${etiquetaDe(clave)}</dt><dd>${valor}</dd></div>`,
					),
					`<div><dt>Fotos</dt><dd>${galeria.length}</dd></div>`,
				].join('');

				$('pregunta').textContent = editando
					? '¿Guardamos los cambios de este coche?'
					: '¿Damos de alta este coche?';
				$('confirmacion').showModal();
			});

			$('volver').addEventListener('click', () => $('confirmacion').close());

			const avisar = (texto, clase = '') =>
				($('resultado').innerHTML = `<div class="aviso ${clase}">${texto}</div>`);

			$('confirmar').addEventListener('click', async () => {
				$('confirmacion').close();
				$('confirmar').disabled = true;

				try {
					// Editar reemplaza el .txt y conserva referencia y fotos; solo se
					// vuelven a subir si se ha elegido una carpeta nueva.
					if (editando) {
						const referencia = $('formulario').dataset.referencia;

						// Las que ya estaban en R2 no se tocan: si solo se ha cambiado el
						// orden, esto no sube nada y el orden viaja en el campo Fotos.
						const nombres = nombresDeGaleria();
						let hechas = 0;

						for (const [indice, foto] of galeria.entries()) {
							if (foto.tipo !== 'nueva') continue;

							avisar(`Subiendo fotos nuevas… ${++hechas} de ${sinSubir().length}`);

							const subida = await fetch(
								`/api/fotos?referencia=${referencia}&indice=${Number(nombres[indice])}`,
								{ method: 'POST', body: foto.archivo },
							).then((r) => r.json());

							if (subida.error) throw new Error(`Foto ${hechas}: ${subida.error}`);
						}

						const cambio = await fetch(`/api/coche/${encodeURIComponent(editando)}`, {
							method: 'PUT',
							headers: { 'content-type': 'application/json' },
							body: JSON.stringify({ datos: recogerDatos(), comentario: $('comentario').value }),
						}).then((r) => r.json());

						if (cambio.error) throw new Error(cambio.error);

						avisar('Coche actualizado.', 'bueno');
						editando = null;
						await revisarPendiente();
						return;
					}

					avisar('Creando la ficha…');

					const alta = await fetch('/api/coche', {
						method: 'POST',
						headers: { 'content-type': 'application/json' },
						body: JSON.stringify({ datos: recogerDatos(), comentario: $('comentario').value }),
					}).then((r) => r.json());

					if (alta.error) throw new Error(alta.error);

					// En el orden de la galería: la primera es la portada.
					for (const [indice, foto] of galeria.entries()) {
						avisar(`Subiendo fotos… ${indice + 1} de ${galeria.length}`);

						const subida = await fetch(
							`/api/fotos?referencia=${alta.referencia}&indice=${indice + 1}`,
							{ method: 'POST', body: foto.archivo },
						).then((r) => r.json());

						if (subida.error) throw new Error(`Foto ${indice + 1}: ${subida.error}`);
					}

					avisar(
						`Coche creado con la referencia <strong>${alta.referencia}</strong> y ${galeria.length} fotos subidas.`,
						'bueno',
					);

					await revisarPendiente();
					$('formulario').classList.add('oculto');
				} catch (error) {
					avisar(`No se pudo completar: ${error.message}`, 'malo');
				} finally {
					$('confirmar').disabled = false;
				}
			});

			/** Publica todo lo pendiente de una vez. Devuelve si ha ido bien.
			 *
			 *  Se hace al cerrar y no después de cada cambio: un commit por cambio
			 *  es un despliegue por cambio, y Cloudflare los encola. */
			async function publicar() {
				const resultado = await fetch('/api/publicar', {
					method: 'POST',
					headers: { 'content-type': 'application/json' },
					body: JSON.stringify({ mensaje: 'Cambios desde el panel' }),
				}).then((r) => r.json());

				if (resultado.error) {
					avisar(`No se pudo publicar: ${resultado.error}`, 'malo');
					return false;
				}

				return true;
			}

			/** Mira si queda algo sin publicar y lo refleja en el botón de cerrar. */
			async function revisarPendiente() {
				const estado = await fetch('/api/pendiente')
					.then((r) => r.json())
					.catch(() => ({ hay: false }));

				$('cerrar').textContent = estado.hay ? 'Publicar y cerrar' : 'Cerrar panel';
				$('cerrar').classList.toggle('pendiente', estado.hay);

				return estado.hay;
			}

			// --- Pantallas ---------------------------------------------------------

			// `editando` guarda el id del coche que se está modificando; en null,
			// el formulario da de alta uno nuevo.
			let editando = null;

			function mostrar(pantalla, titulo) {
				$('titulo').textContent = titulo;
				$('inicio').classList.toggle('oculto', pantalla !== 'inicio');
				$('zona-atras').classList.toggle('oculto', pantalla === 'inicio');
				$('lista').classList.toggle('oculto', pantalla !== 'lista');
				$('destacados').classList.toggle('oculto', pantalla !== 'destacados');
				$('vendidos').classList.toggle('oculto', pantalla !== 'vendidos');
				$('formulario').classList.toggle('oculto', pantalla !== 'formulario');
				if (pantalla !== 'formulario') $('resultado').innerHTML = '';
			}

			function irAlInicio() {
				editando = null;
				galeria = [];
				delete $('formulario').dataset.referencia;
				$('formulario').reset();
				pintarMiniaturas();
				pintarCampos();
				mostrar('inicio', 'Panel');
			}

			$('atras').addEventListener('click', irAlInicio);
			$('cancelar').addEventListener('click', irAlInicio);

			$('empezar').addEventListener('click', () => {
				editando = null;
				galeria = [];
				pintarMiniaturas();
				pintarCampos();
				mostrar('formulario', 'Nuevo coche');
			});

			// --- Coches en venta ---------------------------------------------------

			/** Misma tabla para todas las pantallas: mismas columnas, mismo estilo y
			 *  los botones siempre alineados a la derecha. */
			function tablaDeCoches(coches, botones, vacio = 'No hay ningún coche.') {
				if (coches.length === 0) return `<p class="ayuda">${vacio}</p>`;

				return `<table class="tabla">
					<thead>
						<tr><th>Ref.</th><th>Coche</th><th>Precio</th><th>Fotos</th><th></th></tr>
					</thead>
					<tbody>
						${coches
							.map(
								(coche) => `<tr>
									<td class="ref">${coche.referencia}</td>
									<td>${coche.titulo}</td>
									<td>${coche.precio ? Number(coche.precio).toLocaleString('es-ES') + ' €' : ''}</td>
									<td>${coche.fotos ?? ''}</td>
									<td class="botones">${botones(coche)}</td>
								</tr>`,
							)
							.join('')}
					</tbody>
				</table>`;
			}

			async function verLista() {
				mostrar('lista', 'Coches en venta');
				$('lista').innerHTML = '<p class="ayuda">Cargando…</p>';

				const { coches } = await fetch('/api/coches').then((r) => r.json());

				if (coches.length === 0) {
					$('lista').innerHTML = '<p class="ayuda">No hay ningún coche en venta.</p>';
					return;
				}

				$('lista').innerHTML = tablaDeCoches(coches, (coche) =>
					[
						`<button data-editar="${coche.id}">Editar</button>`,
						`<button data-vendido="${coche.id}">Marcar vendido</button>`,
						`<button data-eliminar="${coche.id}">Eliminar</button>`,
					].join(''),
				);
			}

			$('ver-lista').addEventListener('click', verLista);

			// --- Destacados --------------------------------------------------------


			async function verDestacados() {
				mostrar('destacados', 'Destacados');
				$('destacados').innerHTML = '<p class="ayuda">Cargando…</p>';

				const { destacados, candidatos } = await fetch('/api/destacados').then((r) => r.json());

				$('destacados').innerHTML = `
					<h2>En el carrusel de la portada (${destacados.length})</h2>
					${tablaDeCoches(
						destacados,
						(coche) => `<button data-quitar="${coche.id}">Quitar</button>`,
						'No hay ningún coche destacado.',
					)}

					<h2>Resto de coches en venta (${candidatos.length})</h2>
					${tablaDeCoches(
						candidatos,
						(coche) => `<button data-anadir="${coche.id}">Añadir a destacados</button>`,
						'Todos los coches en venta están ya destacados.',
					)}
				`;
			}

			$('ver-destacados').addEventListener('click', verDestacados);

			// --- Coches vendidos ---------------------------------------------------

			async function verVendidos() {
				mostrar('vendidos', 'Coches vendidos');
				$('vendidos').innerHTML = '<p class="ayuda">Cargando…</p>';

				const { coches } = await fetch('/api/vendidos').then((r) => r.json());

				$('vendidos').innerHTML =
					`<p class="ayuda">Sus fichas siguen publicadas en la web, con el distintivo de vendido. Al eliminarlos desaparecen del todo, con sus fotos.</p>` +
					tablaDeCoches(
						coches,
						(coche) =>
							`<button data-devolver="${coche.id}">Devolver al catálogo</button>` +
							`<button data-eliminar-vendido="${coche.id}">Eliminar</button>`,
						'Todavía no has marcado ningún coche como vendido.',
					);
			}

			$('ver-vendidos').addEventListener('click', verVendidos);

			$('vendidos').addEventListener('click', async (evento) => {
				const boton = evento.target.closest('button[data-eliminar-vendido], button[data-devolver]');
				if (!boton) return;

				const { eliminarVendido, devolver } = boton.dataset;
				boton.disabled = true;

				if (devolver) {
					await fetch(`/api/vendido/${encodeURIComponent(devolver)}/devolver`, { method: 'POST' });

					await verVendidos();
					avisar('Vuelve a estar en el catálogo, con sus fotos.', 'bueno');
					return await revisarPendiente();
				}

				if (!confirm('¿Eliminar este coche vendido del todo? Se borra su ficha y sus fotos. No se puede deshacer.')) {
					boton.disabled = false;
					return;
				}

				const borrado = await fetch(`/api/vendido/${encodeURIComponent(eliminarVendido)}`, {
					method: 'DELETE',
				}).then((r) => r.json());

				await verVendidos();
				avisar(
					`Eliminado.${borrado.fotos?.configurado ? ` Se borraron ${borrado.fotos.borradas} fotos de R2.` : ''}`,
					'bueno',
				);
				await revisarPendiente();
			});

			$('destacados').addEventListener('click', async (evento) => {
				const boton = evento.target.closest('button[data-quitar], button[data-anadir]');
				if (!boton) return;

				boton.disabled = true;
				const { quitar, anadir } = boton.dataset;

				await fetch(`/api/destacados/${encodeURIComponent(quitar ?? anadir)}`, {
					method: quitar ? 'DELETE' : 'POST',
				});

				await verDestacados();
				avisar('Hecho.', 'bueno');
				await revisarPendiente();
			});

			$('lista').addEventListener('click', async (evento) => {
				const boton = evento.target.closest('button[data-editar], button[data-vendido], button[data-eliminar]');
				if (!boton) return;

				const { editar, vendido, eliminar } = boton.dataset;

				if (editar) {
					const coche = await fetch(`/api/coche/${encodeURIComponent(editar)}`).then((r) => r.json());

					editando = editar;
					pintarCampos(coche.datos);
					$('comentario').value = coche.comentario ?? '';
					galeria = [];

					// La referencia se guarda en el formulario: hace falta para subir
					// o borrar fotos de este coche mientras se edita.
					$('formulario').dataset.referencia = coche.datos.reference ?? '';

					const yaEstan = await fetch(
						`/api/fotos?referencia=${encodeURIComponent(coche.datos.reference ?? '')}`,
					).then((r) => r.json());

					// R2 devuelve las fotos por nombre, así que el orden bueno es el del
					// campo Fotos del .txt. Si no se respetara, abrir un coche y guardarlo
					// sin tocar nada le cambiaría la portada.
					const enR2 = yaEstan.fotos ?? [];
					const orden = String(coche.datos.images ?? '')
						.split(',')
						.map((nombre) => nombre.trim())
						.filter(Boolean);
					const porNombre = new Map(enR2.map((foto) => [foto.nombre, foto]));

					galeria = [
						...orden.map((nombre) => porNombre.get(nombre)).filter(Boolean),
						// Las que estén en R2 pero no en el .txt van al final, para verlas
						// en vez de dejarlas ocupando sitio sin que nadie lo sepa.
						...enR2.filter((foto) => !orden.includes(foto.nombre)),
					].map((foto) => ({ tipo: 'r2', ...foto }));

					pintarMiniaturas();
					mostrar('formulario', 'Editar coche');
					return;
				}

				if (vendido) {
					if (!confirm('¿Marcar este coche como vendido? Sale del catálogo pero su ficha sigue publicada.')) return;
					await fetch(`/api/coche/${encodeURIComponent(vendido)}/vendido`, { method: 'POST' });
				}

				let nota = '';

				if (eliminar) {
					if (!confirm('¿Eliminar este coche del todo? Se borra la ficha y sus fotos. No se puede deshacer.')) return;

					const borrado = await fetch(`/api/coche/${encodeURIComponent(eliminar)}`, {
						method: 'DELETE',
					}).then((r) => r.json());

					// Si las fotos se quedan en R2 hay que decirlo: si no, ocupan sitio
					// para siempre sin que nadie se entere.
					nota = borrado.fotos?.configurado
						? ` Se borraron ${borrado.fotos.borradas} fotos de R2.`
						: ' Las fotos siguen en R2: no estaba configurado.';
				}

				await verLista();
				avisar(`Hecho.${nota}`, 'bueno');
				await revisarPendiente();
			});

			$('cerrar').addEventListener('click', async () => {
				$('cerrar').disabled = true;

				if (await revisarPendiente()) {
					avisar('Publicando los cambios…');

					// Si el envío falla no se cierra: hay que poder leer el error y
					// volver a intentarlo, en vez de perder el aviso al apagar.
					if (!(await publicar())) {
						$('cerrar').disabled = false;
						return;
					}
				}

				await fetch('/api/apagar', { method: 'POST' }).catch(() => {});
				document.body.innerHTML =
					'<main><h1>Panel cerrado</h1><p>Los cambios están publicados. En unos minutos se verán en la web.</p><p>Ya puedes cerrar esta pestaña.</p></main>';
			});

			const inicio = await fetch('/api/campos').then((r) => r.json());
			campos = inicio.campos;
			if (!inicio.r2) $('aviso-r2').classList.remove('oculto');
			pintarCampos();
			await revisarPendiente();
		</script>
	</body>
</html>
